    {% if page.password %}
    <div
      id="password-container"
      style="
        text-align: center;
        padding: 50px 20px;
        border-radius: 10px;
        background-color: var(--main-bg);
        border: 1px solid var(--border-color);
      "
    >
      <h2 style="margin-bottom: 20px">🔒 보호된 글입니다</h2>
      <p style="margin-bottom: 30px">
        HTB Active 머신 스포일러 방지 등 암호가 걸려있는 포스트입니다.
      </p>

      <input
        type="password"
        id="post-password"
        placeholder="비밀번호를 입력하세요"
        style="
          padding: 12px;
          width: 60%;
          max-width: 300px;
          border-radius: 6px;
          border: 1px solid var(--border-color);
          background-color: var(--sidebar-bg);
          color: var(--text-color);
        "
        onkeypress="if (event.keyCode == 13) checkPassword();"
      />

      <button
        onclick="checkPassword()"
        style="
          padding: 12px 20px;
          margin-left: 10px;
          border: none;
          border-radius: 6px;
          background-color: var(--link-color);
          color: #fff;
          cursor: pointer;
        "
      >
        확인
      </button>

      <p
        id="password-error"
        style="
          color: #e74c3c;
          display: none;
          margin-top: 15px;
          font-weight: bold;
        "
      >
        비밀번호가 일치하지 않습니다.
      </p>
    </div>

    <div id="secret-content" style="display: none">{{ content }}</div>

    <script>
      function checkPassword() {
        var inputPw = document.getElementById("post-password").value;
        var actualPw = "{{ page.password }}";

        if (inputPw === actualPw) {
          document.getElementById("password-container").style.display = "none";
          document.getElementById("secret-content").style.display = "block";
        } else {
          document.getElementById("password-error").style.display = "block";
        }
      }
    </script>
    {% else %} {{ content }} {% endif %}
